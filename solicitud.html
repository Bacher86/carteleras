<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiero mi Cartelera Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Inter', sans-serif; margin: 0; background: linear-gradient(135deg,#2e314f,#1a1c2c); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; padding: 40px; border-radius: 18px; max-width: 480px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
    h1 { color: #2e314f; font-size: 1.6rem; margin-top: 0; }
    p.sub { color: #777; margin-bottom: 25px; }
    label { font-weight: bold; display: block; margin-top: 14px; margin-bottom: 5px; color: #2e314f; font-size: 0.9rem; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; font-family: inherit; }
    button { width: 100%; padding: 15px; margin-top: 20px; background: #d4af37; color: #1a1a1a; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:hover { opacity: 0.9; }
    #estado { margin-top: 15px; text-align: center; font-weight: bold; }
</style>
</head>
<body>
<div class="card" id="card-form">
    <h1>📺 Quiero mi Cartelera Digital</h1>
    <p class="sub">Dejanos tus datos y te contactamos para activar tu cuenta.</p>
    <label>Nombre de la institución</label>
    <input type="text" id="s-nombre" required>
    <label>Email de contacto</label>
    <input type="email" id="s-email" required>
    <label>Teléfono</label>
    <input type="text" id="s-telefono">
    <label>Contanos un poco (cantidad de pantallas, edificios, etc.)</label>
    <textarea id="s-mensaje" rows="3"></textarea>
    <button id="btnEnviar">Enviar solicitud</button>
    <div id="estado"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyAzBO8TzuGeAV-_nsGDgIWckWhV_vkOhTY",
    authDomain: "cartelera-nube.firebaseapp.com",
    databaseURL: "https://cartelera-nube-default-rtdb.firebaseio.com",
    projectId: "cartelera-nube",
    storageBucket: "cartelera-nube.firebasestorage.app",
    messagingSenderId: "333887658907",
    appId: "1:333887658907:web:c9d3904ad02a8fd9fe1f3e"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

document.getElementById('btnEnviar').onclick = function() {
    const nombre = document.getElementById('s-nombre').value.trim();
    const email = document.getElementById('s-email').value.trim();
    const telefono = document.getElementById('s-telefono').value.trim();
    const mensaje = document.getElementById('s-mensaje').value.trim();
    const estado = document.getElementById('estado');

    if (!nombre || !email) { estado.style.color = '#c0392b'; estado.innerText = 'Completá al menos nombre y email.'; return; }

    db.ref('solicitudes').push({
        nombre, email, telefono, mensaje,
        estado: 'pendiente',
        fecha: new Date().toISOString()
    }).then(() => {
        /* -----------------------------------------------------------
           OPCIONAL: notificación por email al dueño de la plataforma.
           Este proyecto no tiene backend, así que para recibir un mail
           automático hace falta un servicio como EmailJS (gratis,
           100% client-side). Si lo configurás, descomentá y completá:

           emailjs.send('TU_SERVICE_ID', 'TU_TEMPLATE_ID', {
               nombre, email, telefono, mensaje
           }, 'TU_PUBLIC_KEY');

           Guía rápida en el README del proyecto. Mientras tanto, vas
           a ver la solicitud apenas entres a superadmin.html (pestaña
           "Solicitudes", con contador en rojo).
        ----------------------------------------------------------- */
        document.getElementById('card-form').innerHTML = '<h1>✅ ¡Listo!</h1><p class="sub">Recibimos tu solicitud. Te vamos a contactar a la brevedad para activar tu cartelera.</p>';
    }).catch(err => { estado.style.color = '#c0392b'; estado.innerText = 'Error: ' + err.message; });
};
</script>
</body>
</html>
